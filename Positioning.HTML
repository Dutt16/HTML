<!DOCTYPE html>
<html>
    <head>
        <style>
            div {
                right:30px;
                border: 3px solid black;
            }
            div.absolute {
                position: absolute;
                left: 50px;
                border: 3px solid blue;
            }
            div.relative {
                position: relative;
                left: 100px;
                border: 3px solid pink;
            }
            div.fixed {
                position: fixed;
                top: 0;
                right: 20px;
                width: 300px;
                border: 3px solid red;
            }
            div.sticky {
                position: sticky;
                top: 1;
                left: 20px;
                width: 100px;
                border: 3px solid rgb(7, 219, 7);
            }
        </style>
    </head>
    <body>
        <h2>Positioning</h2>
         <div>
            Div with no positioning property.
            </div>
            <div class="sticky">
                Div with sticky position property.
            </div>
            <div class="relative">
                This div element has position: relative.
                <div class="absolute">
                    Absolute class DIV
                </div>
                <div class="fixed">
                    Div with fixed position property.
                </div>
